name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        run: dotnet restore ShowroomManagement.slnx

      - name: Build
        run: dotnet build ShowroomManagement.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test tests/Showroom.UnitTests
          --configuration Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Run integration tests
        run: >
          dotnet test tests/Showroom.IntegrationTests
          --configuration Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx